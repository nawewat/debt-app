<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>สมุดลูกหนี้ · คำนวณดอกเบี้ย</title>
<meta name="theme-color" content="#94B83C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สมุดลูกหนี้">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCEBDF; --bg2:#E8F2EA; --surface:#FFFFFF; --surface2:#F3F8EE; --border:#E1EBDB;
  --text:#1E2A1B; --muted:#6B7A66; --faint:#9AA894;
  --primary:#94B83C; --primary-strong:#6F9226; --primary-soft:#EAF3D6; --on-primary:#FFFFFF;
  --hero1:#A2C54A; --hero2:#86AC30;
  --accent:#F2C440; --accent-soft:#FCF2CF; --accent-text:#7A5B00;
  --danger:#D9534F; --danger-soft:#FBE7E6; --info:#3B8C6E;
  --shadow:0 6px 20px rgba(60,90,40,.08); --radius:20px;
}
[data-theme="dark"]{
  --bg:#0F1710; --bg2:#141E15; --surface:#19241A; --surface2:#203021; --border:#2A3A2B;
  --text:#E7F0E2; --muted:#9BAA95; --faint:#6E7D69;
  --primary:#7A9E2A; --primary-strong:#A6CB4E; --primary-soft:#26371A; --on-primary:#F4F9EC;
  --hero1:#5F8220; --hero2:#46621A;
  --accent:#E0B23A; --accent-soft:#3A3115; --accent-text:#F2CE6A;
  --danger:#E57373; --danger-soft:#3A1F1F; --info:#6CC3A0;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--hero1),var(--hero2));
  display:grid;place-items:center;color:#fff}
.brand b{font-size:17px;font-weight:700;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.on{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.side .spacer{flex:1}
.theme-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface2);color:var(--text);font-weight:500}
.store-note{font-size:11.5px;color:var(--faint);padding:8px 14px 0}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{width:100%;max-width:1180px;margin:0 auto;padding:26px 28px 40px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-head .sub{color:var(--muted);font-size:13px}
.tabbar{display:none}

/* ---------- Cards ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g-main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"a b" "c b";align-items:start}
.ga{grid-area:a}.gb{grid-area:b}.gc{grid-area:c}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.g-detail{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}

/* Hero (green card with gauge) */
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--on-primary);border-radius:24px;padding:20px 22px;
  box-shadow:0 10px 26px rgba(110,150,40,.25);position:relative;overflow:hidden}
[data-theme="dark"] .hero{box-shadow:0 10px 26px rgba(0,0,0,.4)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;z-index:1}
.hero-side{text-align:center}
.hero-side b{font-size:18px;font-weight:700;display:block}
.hero-side span{font-size:12px;opacity:.85}
.gauge{position:relative;width:170px;height:150px}
.gauge svg{width:170px;height:170px;position:absolute;top:0;left:0}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px;text-align:center}
.gauge .mid b{font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.3px}
.gauge .mid span{font-size:11.5px;opacity:.85}
.hero-bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;position:relative;z-index:1}
.hb{text-align:center}
.hb .l{font-size:12px;font-weight:600}
.hb .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.3);margin:5px 10px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hb .v{font-size:11.5px;opacity:.9}

/* Controls */
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;outline:none;transition:border .15s,background .15s}
.input:focus{border-color:var(--primary);background:var(--surface)}
textarea.input{resize:vertical;min-height:60px}
.rate-box{position:relative}
.rate-box .input{padding-right:64px;font-weight:600;font-size:16px}
.rate-box em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--faint)}

.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 10px;border-radius:11px;font-weight:600;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--primary-strong);box-shadow:0 2px 8px rgba(0,0,0,.06)}
[data-theme="dark"] .seg button.on{background:var(--primary-soft)}
.seg.loan button.on[data-v="loan"]{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:600;white-space:nowrap;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:11px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.icon-btn:hover{background:var(--surface2)}
.btn-block{width:100%}

/* Person list */
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface2);text-align:left;width:100%;transition:background .15s}
.prow:hover{background:var(--primary-soft)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0}
.avatar.lg{width:74px;height:74px;font-size:28px;box-shadow:0 0 0 6px var(--primary-soft)}
.prow .meta{flex:1;min-width:0}
.prow .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta span{font-size:12.5px;color:var(--muted)}
.prow .amt{text-align:right}
.prow .amt b{display:block;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--primary-soft);color:var(--primary-strong)}
.chip.warn{background:var(--accent-soft);color:var(--accent-text)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.mute{background:var(--surface2);color:var(--muted)}

/* Debtor tiles (like food tiles) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;box-shadow:var(--shadow);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .name{font-weight:600;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{position:absolute;right:0;bottom:0;background:var(--accent);color:#3D2E00;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:14px 0 20px 0}
.tile .stat{font-size:12px;color:var(--muted);margin-bottom:18px}
.tile.add{border:2px dashed var(--border);box-shadow:none;justify-content:center;min-height:170px;color:var(--muted)}
.tile.add .plus{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.tile.add .plus svg{width:30px;height:30px}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:40px;background:var(--surface);border:1px solid var(--border)}

/* Upload */
.drop{border:2px dashed var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--surface2);transition:border .15s}
.drop:hover,.drop.over{border-color:var(--primary)}
.drop .ic{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center}
.drop small{color:var(--muted);font-size:12px;display:block}
.slip-prev{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2)}
.slip-prev img{display:block;width:100%;max-height:220px;object-fit:contain}
.slip-prev button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.due-box{background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.due-box b{font-size:15px}
.due-box .btn{margin-left:auto}

/* Months */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:12px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--primary-soft);color:var(--primary-strong)}
.month{border:1px solid var(--border);border-radius:18px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.month-h{display:flex;align-items:center;gap:10px;padding:13px 16px;width:100%;text-align:left}
.month-h .t{flex:1;font-weight:600}
.month-h .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.month-h .chev{transition:transform .2s;color:var(--faint)}
.month.open .chev{transform:rotate(180deg)}
.month.cur{border-color:var(--primary)}
.month-b{display:none;padding:0 16px 14px}
.month.open .month-b{display:block}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px;padding:12px;background:var(--surface2);border-radius:14px}
.rows span{color:var(--muted)}
.rows b{text-align:right;font-weight:600}
.rows .sep{grid-column:1/-1;height:1px;background:var(--border);margin:3px 0}
.rows .total{color:var(--text);font-weight:700}
.c-loan{color:var(--danger)} .c-pay{color:var(--primary-strong)} .c-acc{color:var(--accent-text)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tx{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface2)}
.tx .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.tx .ti.loan{background:var(--danger-soft);color:var(--danger)}
.tx .ti.int{background:var(--accent-soft);color:var(--accent-text)}
.tx .ti.prin{background:var(--primary-soft);color:var(--primary-strong)}
.tx .meta{flex:1;min-width:0}
.tx .meta b{font-weight:600;display:block}
.tx .meta span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;cursor:zoom-in;background:var(--border);flex-shrink:0}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.tx .del{color:var(--faint);padding:6px;border-radius:8px}
.tx .del:hover{color:var(--danger);background:var(--danger-soft)}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center}
.empty .big svg{width:32px;height:32px}

.prof{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.prof .info{flex:1;min-width:0}
.prof h2{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .info span{color:var(--muted);font-size:13px}

/* Slip gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gi{background:var(--surface2);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.gi img,.gi .ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--border);display:grid;place-items:center;color:var(--muted)}
.gi .cap{padding:8px 10px;font-size:12px;line-height:1.35}
.gi .cap b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .cap span{color:var(--muted)}
.gi .exp{color:var(--accent-text);font-size:11px}
/* Auth */
body.auth .side,body.auth .tabbar,body.auth .topbar{display:none!important}
body.auth .app{grid-template-columns:1fr}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px}
.auth-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 26px rgba(110,150,40,.3)}
.auth-logo svg{width:34px;height:34px}
.auth-title{text-align:center;margin-bottom:22px}
.auth-title h1{font-size:24px;font-weight:700}
.auth-title p{color:var(--muted);font-size:14px}
.auth-err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:13.5px;display:none}
.auth-err.show{display:block}
.pw-box{position:relative}.pw-box .input{padding-right:46px}
.pw-box button{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);padding:6px;font-size:12px;font-weight:600}
.auth-theme{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px}
.user-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);margin-bottom:8px;width:100%;text-align:left}
.user-box .avatar{width:34px;height:34px;font-size:14px}
.user-box b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-box span{font-size:11.5px;color:var(--muted)}
/* Mobile fit */
html,body{max-width:100%;-webkit-text-size-adjust:100%}
body,.main{overflow-x:clip}
body.auth .content{padding:0;max-width:none}
.auth-wrap{min-height:100vh;min-height:100dvh}
.app{grid-template-columns:240px minmax(0,1fr)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .input,select.input,textarea.input,.search .input,.rate-box .input{font-size:16px}
  .page-head .btn{padding:10px 14px}
  .doc-bar .btn{padding:9px 12px;font-size:14px}
  .ctrl .field{min-width:0!important}
  .seg button{white-space:nowrap}
}
/* OCR */
.ocr{border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ocr small{flex-basis:100%;color:var(--muted);font-size:12px}
.ocr.busy{background:var(--surface2);color:var(--muted)}
.ocr.ok{background:var(--primary-soft);color:var(--primary-strong)}
.ocr.warn{background:var(--accent-soft);color:var(--accent-text)}
.ocr b{font-size:15px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.input.ocr-filled{border-color:var(--primary);background:var(--primary-soft)}
/* Profile / info / contract */
.avatar.ph{background-size:cover;background-position:center;color:transparent}
.avatar.xs{width:28px;height:28px;font-size:12px}
.icon-btn .avatar.xs{width:30px;height:30px}
.page-head .avatar{width:40px;height:40px}
.pic-row{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.logo svg.logo-g{width:78%;height:78%}
.auth-logo svg.logo-g{width:46px;height:46px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px}
.kv span{color:var(--muted)} .kv b{font-weight:500} .kv a{color:var(--primary-strong)}
.map{width:100%;height:190px;border:0;border-radius:14px;background:var(--surface2)}
.idthumb{width:100%;max-height:200px;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--surface2);display:block;min-height:80px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.check input{width:18px;height:18px;accent-color:var(--primary)}
a.btn{text-decoration:none}
#printArea{display:none}
body.doc-open .app,body.doc-open .tabbar{display:none}
body.doc-open #printArea{display:block;background:#e9eee6;min-height:100vh;padding:0 0 40px}
.doc-bar{position:sticky;top:0;display:flex;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
.doc{background:#fff;color:#111;font-family:"Sarabun",serif;font-size:16px;line-height:1.75;width:100%;max-width:210mm;margin:20px auto;padding:22mm 20mm;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.doc h1{text-align:center;font-size:22px;margin-bottom:14px;font-weight:700}
.doc p{margin:0 0 8px}.doc .r{text-align:right}.doc .ind{text-indent:2.5em;text-align:left;word-break:break-word}
.doc .sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px 20px;margin-top:40px;text-align:center}
.doc .sigs p{margin:0}
@media (max-width:600px){.doc{padding:14mm 8mm;font-size:15px;margin:10px 0}.doc .sigs{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff!important}
  body.doc-open .doc-bar,.toast,.modal-bg{display:none!important}
  body.doc-open #printArea{background:#fff;padding:0}
  .doc{box-shadow:none;margin:0 auto;max-width:none;width:210mm}
}
/* Modal */

/* ================= Helpers ================= */

const mName=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});};
const dName=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});};

/* ================= Session settings (not saved) ================= */

const S={rate:DEFAULT_RATE,mode:'carry'}; // carry = ยกดอกค้างแยก, compound = ทบดอกค้างเข้าต้น

/* ================= Firebase config =================
   วาง config จาก Firebase Console ตรงนี้ (Project settings > Your apps > Web app)
   ถ้ายังเป็น "YOUR_API_KEY" แอปจะทำงานโหมดทดลอง (เก็บในเครื่อง ไม่มีล็อกอิน) */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCPn6Y2VfXPr2CBOeCLzuUsrg8oNCV2yqQ",
  authDomain:"debt-app-453e8.firebaseapp.com",
  projectId:"debt-app-453e8",
  storageBucket:"debt-app-453e8.firebasestorage.app",
  messagingSenderId:"283382647810",
  appId:"1:283382647810:web:c25654aeba564e0595eb1b"
};
const FB_VER='10.12.2';
const USER_DOMAIN='debtapp.local'; // ชื่อผู้ใช้จะถูกแปลงเป็น username@debtapp.local ภายในระบบ
const FB_ON=!/YOUR_/.test(FIREBASE_CONFIG.apiKey);

/* ================= Vault: เข้ารหัสข้อมูลในเครื่องก่อนส่งขึ้น Firebase =================
   กุญแจข้อมูล (AES-256) ถูกล็อกด้วยรหัสผ่านของผู้ใช้ (PBKDF2) — ไม่มีใครอ่านได้นอกจากเจ้าของบัญชี
   รวมถึงเจ้าของโปรเจกต์ Firebase / GitHub */
const Vault={
  key:null,
  b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);},
  unb64(str){const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;},
  rnd(n){return crypto.getRandomValues(new Uint8Array(n));},
  async kek(pw,salt){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey']);
  },
  async wrap(dek,pw){const salt=this.rnd(16),iv=this.rnd(12);const k=await this.kek(pw,salt);
    const w=await crypto.subtle.wrapKey('raw',dek,k,{name:'AES-GCM',iv});return {salt:this.b64(salt),iv:this.b64(iv),w:this.b64(w)};},
  async unwrap(rec,pw,extractable){const k=await this.kek(pw,this.unb64(rec.salt));
    return crypto.subtle.unwrapKey('raw',this.unb64(rec.w),k,{name:'AES-GCM',iv:this.unb64(rec.iv)},{name:'AES-GCM'},extractable,['encrypt','decrypt']);},
  async enc(obj){const iv=this.rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this.key,new TextEncoder().encode(JSON.stringify(obj)));
    const out=new Uint8Array(12+ct.byteLength);out.set(iv);out.set(new Uint8Array(ct),12);return this.b64(out);},
  async dec(str){const b=this.unb64(str);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},this.key,b.slice(12));return JSON.parse(new TextDecoder().decode(pt));},
  async openDoc(d){const v=d.data();if(!v)return null;
    if(v.enc){try{return {...await this.dec(v.enc),id:d.id};}catch(e){return null;}}
    return {...v,id:d.id,_plain:true};}
};

/* ================= Storage ================= */
const state={debtors:[],txs:[],ready:false,remote:false,authNeeded:false,user:null};
let slipCache={};
const Store={
  async init(){
    if(FB_ON){
      try{return await this.initFirebase();}
      catch(e){console.error(e);state.err='firebase-load';}
    }
    return this.initLocal();
  },
  /* ---------- Firebase (Auth + Firestore) ---------- */
  async initFirebase(){
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    this.Au=Au;this.F=F;
    const app=A.initializeApp(FIREBASE_CONFIG);
    this.auth=Au.getAuth(app);
    try{this.fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache()});}catch(e){this.fs=F.getFirestore(app);}
    this.remote=true;state.remote=true;
    return new Promise(res=>{
      let first=true;const done=()=>{if(first){first=false;res();}};
      Au.onAuthStateChanged(this.auth,async u=>{
        this.unsubAll();
        state.debtors=[];state.txs=[];slipCache={};fileCache={};wmCache={};state.profile={};state.locked=false;
        if(!u){Vault.key=null;state.user=null;state.authNeeded=true;state.ready=true;render();done();return;}
        state.user={uid:u.uid,name:(u.email||'').replace('@'+USER_DOMAIN,'')};
        this.uid=u.uid;
        state.authNeeded=false;state.ready=false;render();
        try{await this.ensureKey(u.uid);}
        catch(e){console.warn(e);state.locked=true;state.ready=true;render();done();return;}
        this.startData(done);
      });
    });
  },
  startData(cb){
    this.subscribe(this.uid,async()=>{await this.loadProfile();state.ready=true;render();cb&&cb();setTimeout(cleanupSlips,1500);setTimeout(()=>this.migrate(),2500);});
  },
  /* ---------- กุญแจเข้ารหัส (เจ้าของ Firebase อ่านข้อมูลไม่ได้) ---------- */
  async idbOpen(){
    if(this.idb)return this.idb;
    this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('debt-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    return this.idb;
  },
  async ensureKey(uid){
    try{await this.idbOpen();const k=await this.kvGet('dek:'+uid);if(k){Vault.key=k;return;}}catch(e){}
    const pw=this.pendingPw;this.pendingPw=null;
    if(!pw)throw new Error('locked');
    await this.unlockWith(pw);
  },
  async unlockWith(pw){
    const ref=this.ref('meta','key');
    const snap=await this.F.getDoc(ref);
    let key;
    if(!snap.exists()){
      const dek=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
      const rec=await Vault.wrap(dek,pw);
      await this.F.setDoc(ref,rec);
      key=await Vault.unwrap(rec,pw,false);
    }else{
      const rec=snap.data();
      try{key=await Vault.unwrap(rec,pw,false);}
      catch(e){
        if(!rec.next)throw new Error('badpw');
        key=await Vault.unwrap(rec.next,pw,false); // เปลี่ยนรหัสค้างไว้ → ใช้ชุดใหม่
        await this.F.setDoc(ref,{salt:rec.next.salt,iv:rec.next.iv,w:rec.next.w});
      }
    }
    Vault.key=key;
    try{await this.idbOpen();await this.kvSet('dek:'+this.uid,key);}catch(e){}
  },
  async unlock(pw){await this.unlockWith(pw);state.locked=false;state.ready=false;render();this.startData();},
  subscribe(uid,onReady){
    const {collection,onSnapshot}=this.F;
    let got={d:false,t:false},done=false,seq={d:0,t:0};
    const ready=()=>{if(!done&&got.d&&got.t){done=true;clearTimeout(timer);onReady();}};
    const timer=setTimeout(()=>{if(!done){done=true;state.stale=true;onReady();}},10000);
    const err=e=>{state.err=e&&e.code;clearTimeout(timer);if(!done){done=true;onReady();}else render();};
    const handle=(which,field)=>s=>{
      const n=++seq[which];
      Promise.all(s.docs.map(d=>Vault.openDoc(d))).then(arr=>{
        if(n!==seq[which])return;
        state[field]=arr.filter(Boolean);got[which]=true;state.stale=false;done?render():ready();
      });
    };
    this.unsubs=[
      onSnapshot(collection(this.fs,'users',uid,'debtors'),handle('d','debtors'),err),
      onSnapshot(collection(this.fs,'users',uid,'txs'),handle('t','txs'),err)
    ];
  },
  async migrate(){ // แปลงข้อมูลเก่าที่ยังไม่เข้ารหัส
    if(!this.remote||!Vault.key)return;
    for(const d of state.debtors.filter(x=>x._plain)){const {_plain,...x}=d;try{await this.saveDebtor(x);}catch(e){}}
    for(const t of state.txs.filter(x=>x._plain)){const {_plain,...x}=t;try{await this.saveTx(x);}catch(e){}}
  },
  unsubAll(){(this.unsubs||[]).forEach(f=>{try{f();}catch(e){}});this.unsubs=[];},
  ref(col,id){return this.F.doc(this.fs,'users',this.uid,col,id);},
  async login(username,pw){this.pendingPw=pw;try{await this.Au.signInWithEmailAndPassword(this.auth,toEmail(username),pw);}catch(e){this.pendingPw=null;throw e;}},
  async register(username,pw){this.pendingPw=pw;try{await this.Au.createUserWithEmailAndPassword(this.auth,toEmail(username),pw);}catch(e){this.pendingPw=null;throw e;}},
  async logout(){try{await this.idbOpen();await this.kvSet('dek:'+this.uid,undefined);}catch(e){}Vault.key=null;authMode='login';await this.Au.signOut(this.auth);},
  async changePassword(oldPw,newPw){
    const u=this.auth.currentUser;
    const cred=this.Au.EmailAuthProvider.credential(u.email,oldPw);
    await this.Au.reauthenticateWithCredential(u,cred);
    const ref=this.ref('meta','key');
    const rec=(await this.F.getDoc(ref)).data();
    const dek=await Vault.unwrap(rec,oldPw,true);
    const next=await Vault.wrap(dek,newPw);
    await this.F.setDoc(ref,{salt:rec.salt,iv:rec.iv,w:rec.w,next});
    await this.Au.updatePassword(u,newPw);
    await this.F.setDoc(ref,next);
  },
  /* ---------- Local (โหมดทดลอง) ---------- */
  async initLocal(){
    this.remote=false;
    try{
      await this.idbOpen();
      const s=await this.kvGet('state');
      if(s){state.debtors=s.debtors||[];state.txs=s.txs||[];}
      await this.loadProfile();
    }catch(e){this.idb=null;}
    state.ready=true;
    setTimeout(cleanupSlips,1500);
  },
  kvGet(k){return new Promise(res=>{if(!this.idb)return res(null);const r=this.idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});},
  kvSet(k,v){return new Promise(res=>{if(!this.idb)return res();const tx=this.idb.transaction('kv','readwrite');v===undefined?tx.objectStore('kv').delete(k):tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();});},
  persistLocal(){return this.kvSet('state',{debtors:state.debtors,txs:state.txs});},
  /* ---------- CRUD ---------- */
  async saveDebtor(d){
    const {id,...body}=d;

/* ================= Interest engine (งวดตามวันที่ยืม) =================
   งวดนับจากวันที่ยืมครั้งแรก เช่น ยืม 8 ส.ค. → งวด ส.ค. = 8 ส.ค.–8 ก.ย. ครบกำหนดจ่ายดอก 8 ก.ย.
   - ดอกงวด = (ต้นต้นงวด + ยืมเพิ่มในงวด) × %
   - เงินที่จ่ายภายในงวด ถึงวันครบกำหนด (รวมวันครบกำหนด) นับเป็นของงวดนั้น
   - จ่ายดอก ตัดดอกที่ค้างเก่าสุดก่อน (FIFO) ถ้าเกินยอดดอกค้าง ส่วนเกินตัดต้น */
const pad2=n=>String(n).padStart(2,'0');
function addMonthsAnchor(anchor,k){const[y,m,d]=anchor.split('-').map(Number);let mm=m-1+k;const yy=y+Math.floor(mm/12);mm=((mm%12)+12)%12;const dim=new Date(yy,mm+1,0).getDate();return yy+'-'+pad2(mm+1)+'-'+pad2(Math.min(d,dim));}
function compute(debtorId){
  const rate=S.rate/100, compound=S.mode==='compound', td=today();
  const list=state.txs.filter(t=>t.debtorId===debtorId).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  const res={periods:[],principal:0,arrears:0,overdue:0,totalLoan:0,paidInt:0,paidPrin:0,charged:0,txs:list,cur:null};
  if(!list.length)return res;
  const anchor=list[0].date, lastDate=list[list.length-1].date, end=lastDate>td?lastDate:td;
  let P=0, queue=[];
  const qsum=()=>r2(queue.reduce((s,q)=>s+q.amt,0));
  for(let k=0;k<1200;k++){
    const S0=addMonthsAnchor(anchor,k), N=addMonthsAnchor(anchor,k+1);
    if(S0>end)break;
    const loansTx=list.filter(t=>t.type==='loan'&&t.date>=S0&&t.date<N);
    const paysTx=list.filter(t=>t.type==='repay'&&(k===0?t.date>=S0:t.date>S0)&&t.date<=N);
    const loans=r2(loansTx.reduce((s,t)=>s+(+t.amount),0));
    const per={k,S:S0,N,openP:P,openA:qsum(),loans,interest:0,paidFor:0,payI:0,payP:0,extra:0,folded:0,foldedOut:0,
      txs:[...loansTx,...paysTx].sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0))};
    const base=r2(P+loans);
    per.interest=r2(base*rate);
    if(per.interest>0)queue.push({p:per,amt:per.interest});
    P=base;
    for(const t of paysTx){
      let amt=+t.amount;
      if(t.repayKind==='interest'){
        per.payI=r2(per.payI+amt);
        while(amt>0.004&&queue.length){const q=queue[0];const take=Math.min(q.amt,amt);q.amt=r2(q.amt-take);q.p.paidFor=r2(q.p.paidFor+take);amt=r2(amt-take);res.paidInt=r2(res.paidInt+take);if(q.amt<=0.004)queue.shift();}
        if(amt>0.004){per.extra=r2(per.extra+amt);P=r2(P-amt);}
      }else{per.payP=r2(per.payP+amt);P=r2(P-amt);}
    }
    if(compound&&queue.length){const rem=qsum();queue.forEach(q=>q.p.foldedOut=r2(q.p.foldedOut+q.amt));per.folded=rem;P=r2(P+rem);queue=[];}
    if(P<0)P=0;
    per.closeP=P;per.closeA=qsum();
    res.totalLoan=r2(res.totalLoan+loans);res.charged=r2(res.charged+per.interest);res.paidPrin=r2(res.paidPrin+per.payP+per.extra);
    const empty=per.openP<=0&&per.openA<=0&&!loans&&!paysTx.length;
    if(!empty)res.periods.push(per);
    if(S0<=td&&td<N)res.cur=empty?null:per;
    if(P<=0.004&&!queue.length&&lastDate<=N)break;
  }
  res.periods.forEach(p=>{
    if(p.interest<=0.004)p.status='closed';
    else if(p.paidFor>=p.interest-0.004)p.status='paid';
    else if(p.foldedOut>0)p.status='folded';
    else if(td<=p.N)p.status=p.paidFor>0?'partialPending':'pending';
    else p.status=p.paidFor>0?'partial':'unpaid';
  });
  res.principal=P;res.arrears=qsum();
  res.overdue=r2(queue.filter(q=>q.p.N<td).reduce((s,q)=>s+q.amt,0));
  return res;
}
const STATUS={paid:['ok','จ่ายดอกครบ'],partial:['bad','จ่ายบางส่วน · ค้าง'],unpaid:['bad','ค้างชำระ'],pending:['warn','รอครบกำหนด'],
  partialPending:['warn','จ่ายบางส่วน'],folded:['mute','ทบเข้าต้นแล้ว'],closed:['mute','ปิดยอดแล้ว']};
const chip=s=>{const[c,t]=STATUS[s]||['mute','—'];return `<span class="chip ${c}">${t}</span>`;};
function personStatus(r){
  if(!r.txs.length)return '<span class="chip mute">ยังไม่มีรายการ</span>';
  if(r.principal<=0.004&&r.arrears<=0.004)return chip('closed');
  if(r.overdue>0.004)return `<span class="chip bad">ค้าง ${fmt0(r.overdue)}</span>`;
  return r.cur?chip(r.cur.status):chip('paid');
}

   </div></div>`;
}

const SLIP_KEEP_DAYS=365;

  const now=Date.now();
  const old=state.txs.filter(t=>t.hasSlip&&slipExpire(t)<now);
  for(const t of old){try{await Store.deleteSlip(t.id);await Store.updateTx({...t,hasSlip:false,slipCleared:now});}catch(e){}}
  if(old.length){render();toast(`ล้างสลิปที่เก็บครบ 1 ปีแล้ว ${old.length} รูป`);}
}

  $('#txForm').onsubmit=async e=>{

async function takeFile(f){
  if(!f.type.startsWith('image/')){toast('รองรับเฉพาะไฟล์รูปภาพ');return;}
  try{ui.form.slip=await compress(f);ui.form.ocr=null;render();}catch(e){toast('อ่านรูปไม่ได้');return;}
  if(ui.form.type==='repay'||!ui.form.amount)runSlipOcr(f);
}
function compress(file,MAX=1200,LIMIT=220000){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      let max=MAX,q=.8,out;
      const draw=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);};
      out=draw();
      while(out.length>LIMIT&&max>400){max-=150;q=Math.max(.5,q-.06);out=draw();}
      URL.revokeObjectURL(url);res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}

function cropSquare(file,size=256){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});
}
const WM_TEXT='ใช้เป็นหลักฐานการยืมเงินเท่านั้น';
let wmCache={};
function watermark(src,key){
  if(key&&wmCache[key])return Promise.resolve(wmCache[key]);
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');
    x.drawImage(img,0,0);
    const fs=Math.max(16,Math.round(c.width/16));
    x.save();x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/7);
    x.font=`700 ${fs}px Anuphan, sans-serif`;x.textAlign='center';x.textBaseline='middle';
    const stepY=fs*3.2,stepX=x.measureText(WM_TEXT).width+fs*2,R=Math.hypot(c.width,c.height);
    for(let yy=-R;yy<R;yy+=stepY){const off=(Math.round(yy/stepY)%2)*stepX/2;for(let xx=-R;xx<R;xx+=stepX){
      x.lineWidth=Math.max(2,fs/10);x.strokeStyle='rgba(255,255,255,.55)';x.strokeText(WM_TEXT,xx+off,yy);
      x.fillStyle='rgba(200,30,30,.42)';x.fillText(WM_TEXT,xx+off,yy);}}
    x.restore();
    const bh=Math.round(fs*1.5);x.fillStyle='rgba(200,30,30,.85)';x.fillRect(0,c.height-bh,c.width,bh);
    x.fillStyle='#fff';x.font=`600 ${Math.round(fs*.62)}px Anuphan, sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(WM_TEXT+' · ห้ามนำไปใช้เพื่อการอื่น',c.width/2,c.height-bh/2);
    const out=c.toDataURL('image/jpeg',.88);if(key)wmCache[key]=out;res(out);};
    img.onerror=rej;img.src=src;});
}
function parseMap(link){
  if(!link)return null;const s=String(link);
  const pats=[/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const p of pats){const m=s.match(p);if(m)return {lat:+m[1],lng:+m[2]};}
  return null;
}
function mapHref(link){const s=String(link||'').trim();if(/^https:\/\//i.test(s))return s;const c=parseMap(s);return c?`https://www.google.com/maps?q=${c.lat},${c.lng}`:'';}

/* ---- Thai baht text ---- */
function bahtText(n){
  n=Math.round((+n||0)*100)/100;const nums=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],pos=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const read=s=>{let out='';const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
      if(p===0&&d===1&&L>1)out+='เอ็ด';else if(p===1&&d===2)out+='ยี่';else if(p===1&&d===1)out+='';else out+=nums[d];out+=pos[p];}return out;};
  const readBig=s=>{if(s.length>6){return readBig(s.slice(0,-6))+'ล้าน'+read(s.slice(-6));}return read(s);};
  const [b,st]=n.toFixed(2).split('.');
  let t=+b?readBig(String(+b))+'บาท':'';
  t+=+st?readBig(String(+st))+'สตางค์':(t?'ถ้วน':'ศูนย์บาทถ้วน');
  return t;
}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&window.__libs&&window.__libs[src])return res();const s=document.createElement('script');s.src=src;s.onload=()=>{(window.__libs=window.__libs||{})[src]=1;res();};s.onerror=rej;document.head.appendChild(s);});}
async function makePdf(docEl,name){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  try{await document.fonts.ready;}catch(e){}
  const W=794,PH=Math.round(W*297/210),M=60; // A4 @96dpi, ขอบบน/ล่างหน้า 2+
  const box=document.createElement('div');box.style.cssText=`position:fixed;left:-10000px;top:0;width:${W}px;background:#fff`;
  const clone=docEl.cloneNode(true);clone.style.cssText=`width:${W}px;max-width:none;margin:0;box-shadow:none;padding:${M+20}px 76px;font-size:16px`;
  clone.querySelectorAll('.sigs').forEach(x=>x.style.gridTemplateColumns='1fr 1fr');
  box.appendChild(clone);document.body.appendChild(box);
  try{
    const top0=clone.getBoundingClientRect().top;
    const blocks=[...clone.querySelectorAll('h1,p,.sigs>div')].map(e=>{const r=e.getBoundingClientRect();return {t:r.top-top0,b:r.bottom-top0};});
    const H=clone.scrollHeight,scale=2;
    const cv=await html2canvas(clone,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:W});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'px',format:[W,PH],orientation:'portrait',hotfixes:['px_scaling']});
    let y=0,first=true;
    while(y<H-4){
      const room=PH-(first?0:M)-M;
      let end=Math.min(H,y+room);
      if(end<H){const fit=blocks.filter(k=>k.b<=end&&k.b>y).map(k=>k.b);if(fit.length)end=Math.max(...fit)+6;}
      const sh=Math.max(1,Math.round((end-y)*scale));
      const pc=document.createElement('canvas');pc.width=cv.width;pc.height=sh;
      pc.getContext('2d').drawImage(cv,0,Math.round(y*scale),cv.width,sh,0,0,cv.width,sh);
      if(!first)pdf.addPage([W,PH],'portrait');
      pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,first?0:M,W,end-y);
      y=end;first=false;
    }
    const blob=pdf.output('blob');
    return new File([blob],name,{type:'application/pdf'});
  }finally{box.remove();}
}
async function sharePdf(file,btn,auto){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});return;}
  }catch(e){if(e&&e.name==='AbortError')return;if(auto){toast('PDF พร้อมแล้ว — แตะปุ่มอีกครั้งเพื่อบันทึก');return;}}
  const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast('ดาวน์โหลด PDF แล้ว');
}

/* ================= อ่านยอดเงินจากสลิป (OCR ในเครื่อง ไม่ส่งรูปออกไปไหน) ================= */
const OCR={w1:null,w2:null,
  async lib(){if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');return window.Tesseract;},
  async full(){if(!this.w1){const T=await this.lib();this.w1=await T.createWorker(['tha','eng'],1);}return this.w1;},
  async digits(){if(!this.w2){const T=await this.lib();this.w2=await T.createWorker('eng',1);
    await this.w2.setParameters({tessedit_char_whitelist:'0123456789.,',tessedit_pageseg_mode:'7'});}return this.w2;}
};
async function prepImage(file){ // ขยาย + ขาวดำ + เพิ่มคอนทราสต์ ให้ตัวเลขชัด
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(2.5,Math.max(1,1400/img.width));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=g<140?Math.max(0,(g-40)*1.4):Math.min(255,(g-140)*1.6+150);p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);return c;
  }finally{URL.revokeObjectURL(url);}
}
const AMT_RE=/(\d{1,3}(?:[,，]\d{3})+|\d{1,7})[.．](\d{2})(?!\d)/g;
function parseAmt(t){const m=[...String(t).matchAll(AMT_RE)];return m.map(x=>({v:parseFloat(x[1].replace(/[,，]/g,'')+'.'+x[2]),raw:x[0]}));}
async function readSlipAmount(file){
  const cv=await prepImage(file);
  const w=await OCR.full();
  const {data}=await w.recognize(cv);
  const lines=(data.lines||[]).map(l=>({text:l.text.replace(/\s+/g,' ').trim(),bbox:l.bbox,words:l.words||[]}));
  let best=null;
  lines.forEach((l,i)=>{
    const t=l.text, prev=(lines[i-1]||{}).text||'';
    if(/ค่าธรรมเนียม|fee|คงเหลือ|balance|เลขที่|ref|รหัส|บัญชี|account/i.test(t)&&!/จำนวน|amount/i.test(t))return;
    parseAmt(t).forEach(a=>{
      if(!(a.v>0))return;
      let sc=0;
      if(/จำนวน|ยอด|amount|โอนเงิน|total/i.test(t))sc+=5;
      if(/จำนวน|amount/i.test(prev))sc+=4;
      if(/บาท|THB|฿|baht/i.test(t))sc+=3;
      if(/[,，]\d{3}/.test(a.raw)||a.v>=1)sc+=1;
      sc+=Math.min(4,(l.bbox.y1-l.bbox.y0)/Math.max(1,cv.height)*120); // ตัวใหญ่ = ยอดเงินบนสลิป
      if(!best||sc>best.sc)best={...a,sc,line:l};
    });
  });
  if(!best)return null;
  // รอบ 2: อ่านเฉพาะบรรทัดยอดเงินด้วยโหมดตัวเลขล้วน เพื่อกันเลขเพี้ยน
  let second=null;
  try{
    const b=best.line.bbox,pad=8;
    const w2=await OCR.digits();
    const r=await w2.recognize(cv,{rectangle:{left:Math.max(0,b.x0-pad),top:Math.max(0,b.y0-pad),width:Math.min(cv.width,b.x1+pad)-Math.max(0,b.x0-pad),height:Math.min(cv.height,b.y1+pad)-Math.max(0,b.y0-pad)}});
    const c=parseAmt(r.data.text).sort((a,b)=>b.v-a.v);
    if(c.length)second=c.find(x=>Math.abs(x.v-best.v)<0.005)||c[0];
  }catch(e){}
  const agree=!!second&&Math.abs(second.v-best.v)<0.005;
  return {amount:best.v,alt:second&&!agree?second.v:null,sure:agree};
}

  F.ocr={st:'busy'};render();

    const r=await Promise.race([readSlipAmount(file),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),45000))]);
    if(ui.form.ocrToken!==token)return;
    syncFormSafe();
    if(r){ui.form.amount=r.amount.toFixed(2);ui.form.ocr={st:'ok',...r};}
    else ui.form.ocr={st:'fail'};
  }catch(e){console.warn(e);if(ui.form.ocrToken===token){syncFormSafe();ui.form.ocr={st:'fail'};}}
  render();
}
function syncFormSafe(){const d=$('#fDate'),n=$('#fNote');if(d)ui.form.date=d.value;if(n)ui.form.note=n.value;}
function ocrBox(F){
  const o=F.ocr;if(!o||!F.slip)return'';
  if(o.st==='busy')return `<div class="ocr busy"><span class="spin"></span>กำลังอ่านยอดเงินจากสลิป… <small>(ครั้งแรกโหลดตัวอ่านประมาณ 10–20 วินาที)</small></div>`;
  if(o.st==='fail')return `<div class="ocr warn">อ่านยอดจากสลิปไม่ได้ กรุณากรอกจำนวนเงินเอง</div>`;
  return `<div class="ocr ${o.sure?'ok':'warn'}">${o.sure?'✅ อ่านยอดจากสลิปได้':'⚠️ อ่านได้แต่ไม่แน่ใจ'} <b class="num">${fmt(o.amount)}</b>${o.alt?` <button type="button" class="btn btn-sm btn-ghost" id="ocrAlt">ใช้ ${fmt(o.alt)}</button>`:''}<small>ตรวจกับสลิปอีกครั้งก่อนกดบันทึก</small></div>`;
}

/* ================= Modals ================= */
function openModal(html,cls=''){const m=$('#modal');m.className='modal '+cls;m.innerHTML=html;$('#modalBg').classList.add('show');}
function closeModal(){$('#modalBg').classList.remove('show');}
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function confirmModal(title,msg,fn){
  openModal(`<h3>${esc(title)}</h3><p style="color:var(--muted)">${esc(msg)}</p><div class="acts"><button class="btn btn-ghost" id="mCancel">ยกเลิก</button><button class="btn btn-danger" id="mOk">${ic('trash')}ลบ</button></div>`);
  $('#mCancel').onclick=closeModal;
  $('#mOk').onclick=async()=>{$('#mOk').disabled=true;try{await fn();}catch(e){toast('ทำรายการไม่สำเร็จ');}closeModal();};
}
function imgModal(src){openModal(`<img src="${src}" alt="สลิป"><div class="acts" style="margin-top:10px"><button class="btn btn-ghost" id="mCancel">ปิด</button></div>`,'img');$('#mCancel').onclick=closeModal;}

/* ================= Boot ================= */
paintIcons();
$('#logoSide').innerHTML=LOGO;$('#logoTop').innerHTML=LOGO;
readHash();
Store.init().then(()=>render());
</script>
